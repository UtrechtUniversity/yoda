[defaults]
inventory = ./environments/development/allinone
host_key_checking = False
roles_path = ./roles
library = ./library
# Reduce poll interval to 5s (default 15s)
poll_interval = 5
# Enable timer plugin and per-task/per-role profiling.
callbacks_enabled = timer, profile_tasks, profile_roles
# Disable cowsay.
nocows = 1
timeout = 30
# Gather facts only once per host per run and reuse cached facts across the
# plays of a run (the main playbook consists of many plays targeting the
# same hosts). Cached facts expire after 24 hours.
gathering = smart
fact_caching = jsonfile
fact_caching_connection = ~/.ansible/yoda_fact_cache
fact_caching_timeout = 86400
# Number of parallel host connections (default 5).
forks = 20

[ssh_connection]
# Enable SSH pipelining.
pipelining = True
# Enable SSH multiplexing.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
control_path = /tmp/ansible-ssh-%%h-%%p-%%r
