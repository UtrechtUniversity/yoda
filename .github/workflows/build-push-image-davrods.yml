---
name: "Build DavRODS image and push it to registry"

on:
  push:
    branches:
      - 'development'
      - 'release-[0-9]+.[0-9]+'
    paths:
      - '.github/workflows/build-push-image-davrods.yml'
      - 'docker/images/davrods/**'
      - 'roles/yoda_davrods/files/initialize-davrods-lockdb.py'

jobs:
  push-image:
    if: github.repository == 'utrechtuniversity/yoda'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
    - name: Extract branch name
      shell: bash
      run: echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_OUTPUT
      id: extract_branch

    - name: Check out Yoda repository
      uses: actions/checkout@v7
      with:
        path: yoda
        repository: UtrechtUniversity/yoda
        ref: ${{ steps.extract_branch.outputs.branch }}

    - name: Authenticate to the container registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Stage files for Docker image
      run: |
        cd yoda/docker/images/davrods
        ./stage-uploads.sh

    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: yoda/docker/images/davrods
        file: yoda/docker/images/davrods/Dockerfile
        push: true
        tags: ghcr.io/utrechtuniversity/davrods:${{ steps.extract_branch.outputs.branch }}
        build-args: |
          TAG=${{ steps.extract_branch.outputs.branch }}
