name: 🐞 Bug Report
description: Let us know that something isn't working as intended
type: bug
body:
- type: checkboxes
  attributes:
    label: Is there an existing bug report for this?
    description: Please search to see if a bug report already exists for the bug you encountered.
    options:
    - label: I have searched the existing bug reports
      required: true
- type: textarea
  attributes:
    label: Current Behavior
    description: A concise description of what you're experiencing.
  validations:
    required: true
- type: textarea
  attributes:
    label: Expected Behavior
    description: A concise description of what you expected to happen.
  validations:
    required: true
- type: textarea
  attributes:
    label: Steps to Reproduce
    description: Steps to reproduce the behavior.
    placeholder: |
      1. In this environment...
      2. With this config...
      3. Run '...'
      4. See error...
  validations:
    required: true
- type: textarea
  attributes:
    label: Environment
    description: |
      Please provide details about your environment:
    value: |
      - Yoda version (e.g., v1.9.x)
      - Ansible version (e.g., v2.11)
      - Operating System (e.g., Ubuntu 24.04 LTS)
      - Browser (e.g., Firefox 128 ESR)
    render: markdown
  validations:
    required: true
- type: textarea
  attributes:
    label: Additional Context
    description: |
      Screenshots? Debug logs? Any additional information that will help us understand the issue you're encountering.

      Tip: You can attach images or log files by clicking this area to highlight it and then dragging files in.
  validations:
    required: false
