name: 📋 Feature Request
description: Suggest a new feature for Yoda
type: feature
body:
- type: checkboxes
  attributes:
    label: Is there an existing feature request for this?
    description: Please search to see if a feature request already exists for this.
    options:
    - label: I have searched the existing feature requests
      required: true
- type: textarea
  attributes:
    label: Is your feature request related to a problem? Please describe.
    description: A clear and concise description of the problem you are facing.
    placeholder: |
      Example: I want to do X, but there is no way to do it.
  validations:
    required: true
- type: textarea
  attributes:
    label: Describe the solution you'd like
    description: A clear and concise description of the feature you would like to see implemented.
    placeholder: |
      Example: I think it would be beneficial to add feature Y to simplify the process.
  validations:
    required: true
- type: textarea
  attributes:
    label: Describe alternatives you've considered
    description: A clear and concise description of any alternative solutions or features you've considered.
    placeholder: |
      Example: I considered Z, but that didn't work because...
  validations:
    required: false
- type: textarea
  attributes:
    label: Additional Context
    description: |
      Add any other context, screenshots, or relevant information that could help in understanding your request.

      Tip: You can attach images or log files by clicking this area to highlight it and then dragging files in.
  validations:
    required: false
- type: textarea
  attributes:
    label: Acceptance Criteria
    description: Define the criteria that must be met for this feature to be considered complete.
    placeholder: |
      Example: The feature should allow users to do X, Y, and Z.
  validations:
    required: true
