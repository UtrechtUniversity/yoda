# copyright Utrecht University

- name: Run sqlcipher tasks if role has not run yet
  ansible.builtin.include_tasks: main-tasks.yml
  when: '"yoda_sqlcipher_role_has_run" not in hostvars[inventory_hostname]'

- name: Register that sqlcipher role has run
  ansible.builtin.set_fact:
    yoda_sqlcipher_role_has_run: true
  when: '"yoda_sqlcipher_role_has_run" not in hostvars[inventory_hostname]'
