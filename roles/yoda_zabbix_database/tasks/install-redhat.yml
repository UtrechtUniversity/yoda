---
# copyright Utrecht University

- name: Check if Zabbix agent2 PostgreSQL plugin is installable from repository
  ansible.builtin.dnf: # noqa fqcn[action-core]
    list: '{{ zabbix_agent2_postgresql_plugin.package }}'
  register: zabbix_pgsqlplugin_repo


- name: Download Zabbix agent2 PostgreSQL plugin rpm
  ansible.builtin.get_url:
    url: '{{ zabbix_agent2_postgresql_plugin.url }}/{{ zabbix_agent2_postgresql_plugin.filename }}'
    dest: '{{ yoda_zabbix_package_dir }}/{{ zabbix_agent2_postgresql_plugin.filename }}'
    checksum: '{{ zabbix_agent2_postgresql_plugin.checksum }}'
    mode: '0644'
  when: not zabbix_pgsqlplugin_repo.results and not repo_only


- name: Install Zabbix RPM key
  ansible.builtin.rpm_key:
    key: "{{ zabbix_agent2_postgresql_plugin.rpm_key_loc }}"
    state: present


- name: Install Zabbix agent2 PostgreSQL plugin from downloaded rpm
  ansible.builtin.dnf:
    name: '{{ yoda_zabbix_package_dir }}/{{ zabbix_agent2_postgresql_plugin.filename }}'
    state: present
  when: not zabbix_pgsqlplugin_repo.results and not repo_only and not ansible_check_mode


- name: Ensure Zabbix agent2 PostgreSQL plugin package is installed
  ansible.builtin.package:
    name: '{{ zabbix_agent2_postgresql_plugin.package }}'
    state: present
  when: zabbix_pgsqlplugin_repo.results
