---
# copyright Utrecht University

- name: Ensure iRODS packages YUM repository is enabled
  ansible.builtin.yum_repository:
    name: iRODS-packages
    description: YUM repositories for the iRODS Consortium
    baseurl: https://packages.irods.org/yum/pool/el9/x86_64/
    gpgkey: https://packages.irods.org/irods-signing-key.asc
    gpgcheck: true
  when: ansible_distribution_major_version == "9"
