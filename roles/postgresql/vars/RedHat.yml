openssl_private_dir: '/etc/pki/tls/private'
openssl_certs_dir: '/etc/pki/tls/certs'

postgresql_package_old: 'postgresql{{ pgsql_version_old }}'

postgresql_data_dir: "/var/lib/pgsql/{{ pgsql_version }}/data"
postgresql_bin_path: "/usr/pgsql-{{ pgsql_version }}/bin"
postgresql_config_path: "/var/lib/pgsql/{{ pgsql_version }}/data"
postgresql_daemon: 'postgresql-{{ pgsql_version }}'

postgresql_data_dir_old: "/var/lib/pgsql/{{ pgsql_version_old }}/data"
postgresql_bin_path_old: "/usr/pgsql-{{ pgsql_version_old }}/bin"
postgresql_config_path_old: "/var/lib/pgsql/{{ pgsql_version_old }}/data"
postgresql_daemon_old: 'postgresql-{{ pgsql_version_old }}'

postgresqltuner_dir: "/var/lib/pgsql"
