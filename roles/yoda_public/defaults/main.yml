---
# copyright Utrecht University

landingpages_root: /var/www/landingpages

yoda_moai_user: moai
yoda_moai_home: /var/www/moai

yoda_public_host: combined.yoda.test   # Yoda public host
yoda_public_fqdn: public.yoda.test     # Yoda public fully qualified domain name (FQDN)
yoda_public_port: 443

# OpenSSL configuration.
openssl_crt_signed_and_chain: localhost_and_chain.crt
openssl_key_signed: localhost.key
openssl_crt_signed: localhost.crt

# Anubis configuration
enable_anubis: false                # Enable Anubis
anubis_landingpages_bind_port: 8924
anubis_landingpages_port: 3002

# Addresses Anubis may connect from to the landing pages backend. The client
# IP address in the X-Real-IP header is only trusted for requests from these
# addresses. Anubis connects to the hostname in yoda_public_host, which can
# resolve to a loopback address or to one of the server's own addresses.
yoda_public_anubis_trusted_proxies: "{{ (['127.0.0.1', '::1'] + ansible_facts['all_ipv4_addresses'] | default([]) + ansible_facts['all_ipv6_addresses'] | default([])) | unique | list }}"

# Addresses of load balancers in front of the Anubis-protected virtual host.
# If set, the client address in the X-Forwarded-For header is trusted for
# requests from these addresses. Leave empty if there is no load balancer.
anubis_load_balancer_addresses: []

anubis_yoda_static: /etc/anubis/static-yoda
