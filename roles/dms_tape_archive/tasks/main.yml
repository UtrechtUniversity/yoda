---
# copyright Utrecht University

- name: Copy DA scripts to msiExecCmd dir
  become_user: "{{ irods_service_account }}"
  become: true
  ansible.builtin.copy:
    src: "tape_archive/scripts/{{ item }}"
    dest: "/var/lib/irods/msiExecCmd_bin/{{ item }}"
    mode: '0755'
  with_items:
    - daattr
    - daget


- name: Remove legacy DMF scripts to msiExecCmd dir
  become_user: "{{ irods_service_account }}"
  become: true
  ansible.builtin.file:
    path: "/var/lib/irods/msiExecCmd_bin/{{ item }}"
    state: absent
  with_items:
    - dmattr
    - dmget
    - dmput
