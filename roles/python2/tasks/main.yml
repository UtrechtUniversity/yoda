# copyright Utrecht University

- name: Run python2 tasks if role has not run yet
  ansible.builtin.include_tasks: main-tasks.yml
  when: '"yoda_python2_role_has_run" not in hostvars[inventory_hostname]'

- name: Register that python2 role has run
  ansible.builtin.set_fact:
    yoda_python2_role_has_run: true
  when: '"yoda_python2_role_has_run" not in hostvars[inventory_hostname]'
