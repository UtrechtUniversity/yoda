---
# copyright Utrecht University

- name: Ensure Python 3 is installed
  ansible.builtin.dnf:
    name:
      - gcc
      - python3
      - python3-devel
      - python3-pip
      - python3-pip-wheel
    state: present


- name: Ensure Python 3 virtualenv is installed
  ansible.builtin.pip:
    name: virtualenv
  when: not ansible_check_mode


- name: Ensure Python 3.12 is installed
  ansible.builtin.dnf:
    name:
      - gcc
      - python3.12
      - python3.12-devel
      - python3.12-pip
      - python3.12-wheel
    state: present


- name: Ensure Python 3.12 virtualenv is installed
  ansible.builtin.pip:
    name: virtualenv
    executable: /usr/bin/pip3.12
  when: not ansible_check_mode
