---
# copyright Utrecht University

openssl_private_dir: '/etc/pki/tls/private'
openssl_certs_dir: '/etc/pki/tls/certs'

yoda_davrods_boost_package: boost
yoda_davrods_jansson_package: jansson

# Temporary directory to store downloaded rpm files.
rpm_dest_dir: /tmp

# davrods RPM location and checksum
davrods:
  package: davrods-4.3.3_1.5.1-1
  url: https://github.com/UtrechtUniversity/davrods/releases/tag/4.3.3_1.5.1/
  filename: davrods-4.3.3_1.5.1-1.rpm
  checksum: sha256:ea5f3667123fe73a01f705d7d684689569ca5d3a4eea27b96678f3583593da62

yoda_davrods_site_config_dir: /etc/httpd/conf.d
yoda_davrods_config_file: davrods-vhost.conf
yoda_davrods_anon_config_file: davrods-anonymous-vhost.conf
yoda_davrods_apache_log_dir: /var/log/httpd
yoda_davrods_irods_dir: /etc/httpd/irods
yoda_davrods_config_dir: /etc/httpd/irods
yoda_davrods_user: apache
