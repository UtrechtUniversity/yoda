---
# copyright Utrecht University

- name: Include OS-specific variables
  ansible.builtin.include_vars: "{{ ansible_facts['os_family'] }}-pgsql{{ pgsql_version }}.yml"


- name: Ensure PgBouncer is installed
  ansible.builtin.package:
    name:
      - '{{ pgbouncer_package }}'
    state: present


- name: Upload custom pg_hba.conf file for PGBouncer
  ansible.builtin.copy:
    src: pg_hba.conf
    dest: "{{ pgbouncer_config_path }}/pg_hba.conf"
    owner: postgres
    group: postgres
    mode: '0644'
  notify: Restart PgBouncer


- name: Check whether PgBouncer user list exists
  ansible.builtin.stat:
    path: "{{ pgbouncer_config_path }}/userlist.txt"
  register: pgbouncer_userlist_stat


- name: Retrieve current PgBouncer user list
  ansible.builtin.slurp:
    src: "{{ pgbouncer_config_path }}/userlist.txt"
  register: pgbouncer_userlist
  when: pgbouncer_userlist_stat.stat.exists


# Keep the existing postgres password if userlist.txt already has an entry for it,
# otherwise generate a random 128-bit hexadecimal password.
- name: Determine PgBouncer postgres user password
  ansible.builtin.set_fact:
    pgbouncer_postgres_password: >-
      {{ pgbouncer_userlist.content | default('') | b64decode
         | regex_findall('^"postgres"[ \t]+"([^"]*)"', multiline=True)
         | first
         | default(lookup('ansible.builtin.password', '/dev/null', chars=['0123456789abcdef'], length=32), true) }}
  no_log: true


- name: Ensure PgBouncer user list configuration is present
  ansible.builtin.template:
    src: userlist.txt.j2
    dest: "{{ pgbouncer_config_path }}/userlist.txt"
    group: '{{ pgbouncer_user }}'
    owner: '{{ pgbouncer_user }}'
    mode: '0600'
  notify: Restart PgBouncer


- name: Ensure private key file is available for PgBouncer
  ansible.builtin.copy:
    src: '{{ openssl_private_dir }}/{{ openssl_key_signed }}'
    dest: '{{ pgbouncer_config_path }}/{{ openssl_key_signed }}'
    group: '{{ pgbouncer_user }}'
    owner: '{{ pgbouncer_user }}'
    mode: '0600'
    remote_src: true
  when: not ansible_check_mode


- name: Ensure certificate file is available for PgBouncer
  ansible.builtin.copy:
    src: '{{ openssl_certs_dir }}/{{ openssl_crt_signed }}'
    dest: '{{ pgbouncer_config_path }}/{{ openssl_crt_signed }}'
    group: '{{ pgbouncer_user }}'
    owner: '{{ pgbouncer_user }}'
    mode: '0600'
    remote_src: true
  when: not ansible_check_mode


- name: Ensure PgBouncer is configured
  ansible.builtin.template:
    src: pgbouncer-{{ ansible_facts['os_family'] }}.ini.j2
    dest: "{{ pgbouncer_config_path }}/pgbouncer.ini"
    group: '{{ pgbouncer_user }}'
    owner: '{{ pgbouncer_user }}'
    mode: '0600'
  notify: Restart PgBouncer


- name: Enable and start pgbouncer service
  ansible.builtin.service:
    name: pgbouncer
    enabled: true
    state: started


- name: Allow access to pgbouncer in firewall
  ansible.posix.firewalld:
    port: "6432/tcp"
    permanent: true
    state: enabled
    immediate: true
