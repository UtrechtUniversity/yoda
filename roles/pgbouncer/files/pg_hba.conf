# TYPE  DATABASE   USER      ADDRESS        METHOD
local   pgbouncer  postgres                 peer
local   all        postgres                 peer
# Refuse access to pgbouncer administration console
# with anything other than peer authentication. The postgres
# account is also protected with a long randomly generated
# password, so this is just an additional protection layer.
host    pgbouncer  all       0.0.0.0/0      reject
host    pgbouncer  all       ::/0           reject
# And reject remote access to Postgres account as well,
# since this is not used in the application, and
# technical administrators can use peer authentication.
host    all        postgres  0.0.0.0/0      reject
host    all        postgres  ::/0           reject
# Regular authentication
local   all        all                      md5
host    all        all       127.0.0.1/32   md5
host    all        all       ::1/128        md5
host    all        all       0.0.0.0/0      md5
