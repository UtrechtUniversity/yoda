yoda_portal_fqdn: PLACEHOLDER                          # Yoda portal FQDN

yoda_davrods_fqdn: data.yoda.test                      # Yoda Davrods WebDAV fully qualified domain name (FQDN)
yoda_davrods_port: 443                                 # Yoda Davrods WebDAV port

yoda_davrods_anonymous_enabled: true
yoda_davrods_anonymous_fqdn: public.data.yoda.test
yoda_davrods_anonymous_port: 443

# External Users configuration
external_users: true
external_users_domain_filter: uu.nl | acc.uu.nl        # Domains that should use OIDC (list, wildcard character *)

# Automatic resource balancing configuration
irods_arb_enabled: false
irods_arb_exempt_resources: ""
irods_arb_min_gb_free: 0
irods_arb_min_percent_free: 5

irods_anonymous_account_permit_addresses: []
irods_user_max_connections_enabled: false
irods_user_max_connections_number: 4                          # Limit the number of iRODS connections per user

# Text file extensions configuration
text_file_extensions: ['bash', 'csv', 'c', 'cpp', 'csharp', 'css', 'diff', 'fortran', 'gams', 'gauss', 'go', 'graphql', 'ini', 'irpf90', 'java', 'js', 'json', 'julia', 'julia-repl', 'kotlin', 'less', 'lua', 'makefile', 'markdown', 'md', 'mathematica', 'matlab', 'maxima', 'mizar', 'objectivec', 'openscad', 'perl', 'php', 'php-template', 'plaintext', 'txt', 'python', 'py', 'python-repl', 'r', 'ruby', 'rust', 'sas', 'scilab', 'scss', 'shell', 'sh', 'sql', 'stan', 'stata', 'swift', 'typescript', 'ts', 'vbnet', 'wasm', 'xml', 'yaml', 'html']

# Number of threads for msiDataObjCopy
yoda_rulesets_vault_copy_multithread_enabled: true

# Copy to vault configuration
vault_copy_backoff_time: 900           # How many seconds to wait before trying to copy a certain folder to vault again
vault_copy_max_retries: 5              # How many times to retry copy to vault on particular folder before failing and sending notification

# Coverage measurements for development environments
yoda_rulesets_measure_coverage: false

yoda_rulesets_pregen_data_dir: /var/lib/irods/yoda-pregenerated-data
