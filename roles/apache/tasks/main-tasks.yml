---
# copyright Utrecht University

- name: Include OS-specific variables
  ansible.builtin.include_vars: "{{ ansible_os_family }}.yml"


- name: Ensure Apache webserver is installed
  ansible.builtin.package:
    name:
      - "{{ apache_main_package }}"
      - "{{ apache_dev_package }}"
      - "{{ apache_openssl_package }}"
    state: present


- name: Ensure Apache ModSSL is installed
  ansible.builtin.package:
    name: mod_ssl
    state: present
  when: ansible_os_family == 'RedHat'


- name: Ensure Apache mod_evasive is installed and enabled (Ubuntu)
  become: true
  block:
    - name: Ensure Apache mod_evasive is installed
      ansible.builtin.package:
        name: libapache2-mod-evasive
        state: present

    - name: Enable mod_evasive module
      ansible.builtin.command:
        cmd: a2enmod evasive

  when: ansible_os_family == 'Debian'


- name: Ensure Apache mod_evasive is installed (EL9)
  become: true
  block:
    - name: Download mod_evasive RPM package
      ansible.builtin.get_url:
        url: https://pkgs.sysadmins.ws/el9/modular/x86_64/httpd/mod_evasive-1.10.1-33.el9.x86_64.rpm
        dest: /tmp/mod_evasive-1.10.1-33.el9.x86_64.rpm
        mode: '0644'
        checksum: "sha256:e2741df78705d51561c0bdd3219fe2d4bad1a7946b94eb3fed19ed8ca4e593d2"  # actual checksum of the file
    - name: Install mod_evasive package
      ansible.builtin.package:
        name: /tmp/mod_evasive-1.10.1-33.el9.x86_64.rpm
        state: present
        disable_gpg_check: true

  when: ansible_os_family == 'RedHat'


- name: Allow public to ports for Apache in firewall
  ansible.posix.firewalld:
    port: '{{ item }}'
    permanent: true
    state: enabled
    immediate: true
  with_items:
    - 80/tcp
    - 443/tcp
  notify: Restart firewall


- name: Ensure customized httpd config is present
  ansible.builtin.template:
    src: '{{ apache_main_config_template }}'
    dest: '{{ apache_main_config_file }}'
    mode: '0600'
  notify: Restart Apache webserver


- name: Ensure customized SSL config is present
  ansible.builtin.template:
    src: '{{ apache_ssl_config_template }}'
    dest: '{{ apache_ssl_config_file }}'
    mode: '0600'
  notify: Restart Apache webserver


- name: Ensure config for Apache mod_evasive is present (Ubuntu)
  ansible.builtin.template:
    src: evasive.conf.noble.j2
    dest: /etc/apache2/mods-available/evasive.conf
    mode: '0600'
    owner: root
    group: root
  notify: Restart Apache webserver
  when: ansible_os_family == 'Debian'


#- name: Ensure config for Apache mod_evasive is present (EL9)
#  ansible.builtin.template:
#    src: evasive.conf.el9.j2
#    dest: /etc/httpd/conf.d/mod_evasive.conf
#    mode: '0600'
#    owner: root
#    group: root
#  notify: Restart Apache webserver
#  when: ansible_os_family == 'RedHat'


- name: Ensure config for other VHosts is present (Ubuntu)
  ansible.builtin.template:
    src: other-vhosts-access-log.conf.j2
    dest: /etc/apache2/conf-available/other-vhosts-access-log.conf
    mode: '0644'
  notify: Restart Apache webserver
  when: ansible_os_family == 'Debian'


- name: Copy Apache ports configuration file (Ubuntu)
  ansible.builtin.copy:
    src: ports.conf.noble
    dest: /etc/apache2/ports.conf
    owner: root
    group: root
    mode: '0644'
  when: ansible_os_family == 'Debian'


- name: Ensure autoindex.conf is absent
  ansible.builtin.file:
    path: '{{ item }}'
    state: absent
  notify: Restart Apache webserver
  with_items:
    - /etc/httpd/conf.d/autoindex.conf
  when: ansible_os_family == 'RedHat'


- name: Ensure unused Apache configurations are removed
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  notify: Restart Apache webserver
  with_items:
    - /etc/httpd/conf.modules.d/00-lua.conf
    - /etc/httpd/conf.modules.d/01-cgi.conf
    - /etc/httpd/conf.modules.d/15-php.conf
  when: ansible_os_family == 'RedHat'


- name: Ensure Apache modules used by Yoda are enabled (Ubuntu)
  ansible.builtin.file:
    src: "/etc/apache2/mods-available/{{ item }}"
    dest: "/etc/apache2/mods-enabled/{{ item }}"
    state: link
  notify: Restart Apache webserver
  with_items:
    - headers.load
    - ssl.load
    - socache_shmcb.load
    - evasive.load
    - evasive.conf
  when: ansible_os_family == 'Debian'


- name: Ensure Apache global SSL configuration is loaded (Ubuntu)
  ansible.builtin.file:
    src: "/etc/apache2/mods-available/ssl.conf"
    dest: "/etc/apache2/mods-enabled/ssl.conf"
    state: link
  notify: Restart Apache webserver
  when: ansible_os_family == 'Debian'


- name: Configure Apache apparmor profile
  ansible.builtin.template:
    src: usr.sbin.apache2.j2
    dest: /etc/apparmor.d/usr.sbin.apache2
    owner: root
    group: root
    mode: '0644'
  register: apache_apparmor
  when: ansible_os_family == 'Debian'


- name: Put Apache in AppArmor enforce mode
  ansible.builtin.shell: |
    aa-enforce /usr/sbin/apache2
    apparmor_parser -r /etc/apparmor.d/usr.sbin.apache2
  notify: Restart Apache webserver
  changed_when: true
  when: ansible_os_family == 'Debian' and apache_apparmor.changed


- name: Ensure Apache service is configured
  ansible.builtin.service:
    name: "{{ apache_service_name }}"
    state: started
    enabled: '{{ yoda_enable_httpd }}'
