---
# copyright Utrecht University

- name: Include OS-specific variables
  ansible.builtin.include_vars: "{{ ansible_os_family }}.yml"


- name: Install Anubis (EL)
  ansible.builtin.import_tasks: install-redhat.yml
  when: ansible_os_family == 'RedHat'


- name: Install Anubis (Ubuntu)
  ansible.builtin.import_tasks: install-ubuntu.yml
  when: ansible_os_family == 'Debian'


- name: Generate key for Redis persist after restart for Anubis
  ansible.builtin.command: 'openssl rand -hex 32'
  register: priv_key
  args:
    creates: "{{ anubis_redis_priv_key_path }}"


- name: Store Anubis key in variable
  ansible.builtin.set_fact:
    '{{ item.fact }}': '{{ item.key }}'
  with_items:
    - fact: anubis_redis_priv_key
      key: '{{ priv_key.stdout }}'
  when: not ansible_check_mode


- name: Check if Anubis key file exists
  ansible.builtin.stat:
    path: '{{ anubis_redis_priv_key_path }}'
  ignore_errors: true
  register: anubis_key_exists


- name: Save key in file
  ansible.builtin.copy:
    content: '{{ anubis_redis_priv_key }}'
    dest: '{{ anubis_redis_priv_key_path }}'
    mode: '0644'
  when: not anubis_key_exists.stat.exists and not ansible_check_mode


- name: Ensure Anubis env file is present for DavRods
  ansible.builtin.template:
    src: '{{ item }}.j2'
    dest: '/etc/anubis/{{ item }}'
    mode: '0644'
  notify: Restart Anubis
  with_items:
    - davrods.env
  when: (yoda_davrods_anonymous_enabled is not defined) or yoda_davrods_anonymous_enabled


- name: Ensure Anubis env file is present for landing pages
  ansible.builtin.template:
    src: '{{ item }}.j2'
    dest: '/etc/anubis/{{ item }}'
    mode: '0644'
  notify: Restart Anubis
  with_items:
    - landingpages.env


- name: Ensure Anubis bot policies file is present
  ansible.builtin.template:
    src: yoda.botPolicies.yaml.j2
    dest: /etc/anubis/yoda.botPolicies.yaml
    mode: '0644'
  notify: Restart Anubis


- name: Ensure Apache modules for Anubis are enabled (Ubuntu)
  ansible.builtin.file:
    src: "{{ apache_module_config_dir }}/{{ item }}.load"
    dest: "{{ apache_module_enabled_config_dir }}/{{ item }}.load"
    state: link
  notify: Restart Apache webserver
  with_items:
    - "headers"
    - "proxy"
    - "proxy_http"
    - "rewrite"
    - "substitute"
  when: ansible_os_family == 'Debian'


- name: Allow Anubis to listen on ports for DavRods
  community.general.seport:
    ports: '{{ item }}'
    proto: tcp
    setype: http_port_t
    state: present
  notify: Restart Anubis
  with_items:
    - '{{ anubis_davrods_bind_port }}'
  when: ansible_os_family == 'RedHat' and ansible_selinux.status == "enabled" and ((yoda_davrods_anonymous_enabled is not defined) or yoda_davrods_anonymous_enabled)


- name: Allow Anubis to listen on ports for the landing pages
  community.general.seport:
    ports: '{{ item }}'
    proto: tcp
    setype: http_port_t
    state: present
  notify: Restart Anubis
  with_items:
    - '{{ anubis_landingpages_bind_port }}'
  when: ansible_os_family == 'RedHat' and ansible_selinux.status == "enabled"


- name: Ensure Anubis is running and enabled for Davrods
  ansible.builtin.service:
    name: anubis@davrods.service
    state: started
    enabled: true
  when: (yoda_davrods_anonymous_enabled is not defined) or yoda_davrods_anonymous_enabled


- name: Ensure Anubis is running and enabled for landing pages
  ansible.builtin.service:
    name: anubis@landingpages.service
    state: started
    enabled: true


- name: Ensure Anubis static directory for Yoda images is present
  ansible.builtin.file:
    path: '{{ item }}'
    state: directory
    mode: '0755'
    owner: '{{ yoda_davrods_user }}'
    group: '{{ yoda_davrods_group }}'
  with_items:
    - '{{ anubis_yoda_static }}'
    - '{{ anubis_yoda_static }}/img/'


- name: Ensure static files for Yoda theme for Anubis are present
  ansible.builtin.copy:
    src: yoda.webp
    dest: '{{ anubis_yoda_static }}/img/yoda.webp'
    owner: '{{ yoda_davrods_user }}'
    group: '{{ yoda_davrods_group }}'
    mode: '0644'
