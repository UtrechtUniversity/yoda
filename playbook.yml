---
# copyright Utrecht University
# This playbook deploys a complete Yoda instance.
#
# It is composed of smaller playbooks in the playbooks/ directory. Each of
# those can also be run individually (from the repository root) to deploy or
# iterate on a single component, for example:
#
#   ansible-playbook playbooks/portal.yml -i environments/development/allinone
#
# The order of the imports below matters: the configuration is validated
# first, the database indexes require a provisioned iCAT server, and the
# composable iRODS resources and rulesets require provisioned iCAT and
# resource servers.

- name: Validate configuration
  import_playbook: playbooks/validate.yml

- name: Run preflight checks
  import_playbook: playbooks/preflight.yml

- name: Provision common software and certificates
  import_playbook: playbooks/common.yml

- name: Provision portal server
  import_playbook: playbooks/portal.yml

- name: Provision davrods server
  import_playbook: playbooks/davrods.yml

- name: Provision database server
  import_playbook: playbooks/database.yml

- name: Provision iCAT server
  import_playbook: playbooks/icat.yml

- name: Provision Yoda-specific database indexes
  import_playbook: playbooks/database_indexes.yml

- name: Provision resource server
  import_playbook: playbooks/resource.yml

- name: Provision iRODS resources
  import_playbook: playbooks/irods_resources.yml

- name: Provision rulesets
  import_playbook: playbooks/rulesets.yml

- name: Provision public server
  import_playbook: playbooks/public.yml

- name: Provision external user service server
  import_playbook: playbooks/eus.yml
